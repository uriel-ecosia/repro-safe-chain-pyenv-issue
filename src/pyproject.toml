[project]
name = "arbor"
version = "1.0.0"
description = ""
authors = [{name = "Platform", email = "platform@ecosia.org"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.21.1",
]

[project.scripts]
arbor = "arbor.__main__.cli"

[tool.uv]
exclude-newer = "3 days"

[tool.pytest.ini_options]
xfail_strict = true
# Enforce test file naming convention: test_*.py prefix pattern only
python_files = ["test_*.py"]
# Tell pytest-xdist to determine the number of workers
# Uses pytest_xdist_auto_num_workers (defined in test-utils module) automatically
# That function returns the number of CPUs available in the container or None
# With None, pytest-xdist falls back to its default behavior of looking up
# the number of CPUs on the host machine (for local runs)
# see https://pytest-xdist.readthedocs.io/en/stable/distribution.html
addopts = "-n auto"
markers = [
    "enable_k8s_validation: run the real _validate_kubernetes_jsonnet check",
    "enable_python_project_validation: run the real _validate_python_project_files check",
]
# Suppress upstream package warnings that we cannot fix
filterwarnings = [
    # gh-md-to-html v1.21.3 has invalid escape sequence '\]' at line 997
    # The regex pattern `"[/\\\]"` should be a raw string: `r"[/\\\]"`
    # This warning only appears in CI (fresh environment) because Python recompiles the module
    # Locally, cached .pyc files prevent recompilation, so the warning doesn't appear
    # TODO: Remove this filter when gh-md-to-html releases a version that fixes the invalid escape sequence
    "ignore:invalid escape sequence:SyntaxWarning:gh_md_to_html",
]

[tool.coverage.run]
omit = [
    "*/constants.py",
    "test_*.py",  # Exclude test files from coverage
    "*/test_*.py",
]

[tool.coverage.report]
# These are taken from the upstream recommendations
# https://coverage.readthedocs.io/en/latest/excluding.html#advanced-exclusion
exclude_also = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py313"

[tool.pyright]
venvPath = "."
venv = ".venv"
